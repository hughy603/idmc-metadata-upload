repos:
  # Standard Python pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-ast
      - id: check-docstring-first
      - id: debug-statements
      - id: check-symlinks
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Local Node.js hooks - use system Node installation
  - repo: local
    hooks:
      # Commented prettier hooks - uncomment if needed
      # - id: prettier-fix
      #   name: prettier-fix
      #   entry: npx prettier --write --cache --cache-location .prettiercache
      #   language: system
      #   types_or: [javascript, jsx, ts, tsx, json, css, markdown]
      #   exclude: node_modules/

      # - id: prettier-check
      #   name: prettier-check
      #   entry: npx prettier --check --cache --cache-location .prettiercache
      #   language: system
      #   types_or: [javascript, jsx, ts, tsx, json, css, markdown]
      #   exclude: node_modules/

      - id: eslint
        name: eslint
        entry: npx eslint --fix --max-warnings=100 --quiet
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: \.(js|jsx|ts|tsx)$
        exclude: >
          (?x)^(
            node_modules/|
            scripts/|
            __tests__/|
            create-test-mapping\.js|
            create-test-mapping-csv\.js|
            lib/examples/
          )
        args: [--cache, --cache-location, .eslintcache]

      - id: eslint-next
        name: eslint-next
        entry: npx eslint --fix --max-warnings=100 --quiet
        language: system
        files: 'app/.*\.(js|jsx|ts|tsx)$'
        types_or: [javascript, jsx, ts, tsx]
        exclude: node_modules/
        args: [--cache, --cache-location, .eslintcache]

      # Move these hooks to push stage only to avoid blocking commits
      - id: typescript-check
        name: typescript-check
        entry: npx tsc
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx]
        files: \.(js|jsx|ts|tsx)$
        exclude: node_modules/
        args: [--noEmit, --pretty]
        stages: [push]
        verbose: true

      - id: test
        name: test
        entry: npx jest
        language: system
        pass_filenames: false
        stages: [push]
        verbose: true

      - id: a11y-check
        name: accessibility-check
        entry: npx @axe-core/cli --stdout
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: \.(jsx|tsx)$
        exclude: node_modules/
        stages: [push]
        verbose: true

      - id: npm-audit
        name: npm-audit
        entry: npm audit
        language: system
        pass_filenames: false
        always_run: true
        args: [--audit-level=high]
        stages: [push]

      - id: jscpd
        name: jscpd
        entry: npx jscpd
        language: system
        pass_filenames: false
        args:
          [
            --ignore,
            'node_modules/**,coverage/**,.next/**,__tests__/**,lib/examples/**',
            --threshold=1,
          ]
        stages: [push]

      - id: stylelint
        name: stylelint
        entry: npx stylelint
        language: system
        types_or: [css]
        files: \.(css)$
        exclude: node_modules/
        stages: [push]

      # Add markdown-toc as a local hook to avoid nodeenv issues
      - id: markdown-toc
        name: markdown-toc
        entry: bash -c 'npx markdown-toc -i "$@"' --
        language: system
        files: \.md$
        exclude: node_modules/
        types: [markdown]
        description: 'Automatically updates the table of contents in markdown files'
        require_serial: true
        stages: [push]

  # Security and quality hooks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: bandit-package-json-scan
        args: ['-r', 'package.json']
        stages: [push]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
        stages: [push]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint
        files: Dockerfile
        stages: [commit]

  - repo: https://github.com/crate-ci/typos
    rev: v1.17.2
    hooks:
      - id: typos
        exclude: node_modules/|package-lock.json
        stages: [push]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.4.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
